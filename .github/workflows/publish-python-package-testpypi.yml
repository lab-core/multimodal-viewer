name: Publish Python package to TestPyPI

on:
  push:
    tags:
      # Two-deep versioning patterns for TestPyPI
      - 'v[0-9]+.[0-9]+-test'
      - 'v[0-9]+.[0-9]+a[0-9]+-test' # alpha versions
      - 'v[0-9]+.[0-9]+b[0-9]+-test' # beta versions
      - 'v[0-9]+.[0-9]+rc[0-9]+-test' # release candidates

      # Three-deep versioning patterns for TestPyPI
      - 'v[0-9]+.[0-9]+.[0-9]+-test'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+-test' # alpha versions
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+-test' # beta versions
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+-test' # release candidates

      # Four-deep versioning patterns for TestPyPI
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-test'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+a[0-9]+-test' # alpha versions
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+b[0-9]+-test' # beta versions
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+rc[0-9]+-test' # release candidates

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Extract version
        id: extract_version
        run: |
          # Remove the : "refs/tags/v" prefix and "-test" suffix from the tag
          VERSION=$(expr "${{ github.ref }}" : "refs/tags/v\(.*\)-test")
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish-python-package:
    uses: ./.github/workflows/publish-python-package.yml
    needs: extract-version
    with:
      version: ${{ needs.extract-version.outputs.version }}
      url: https://test.pypi.org/legacy/
