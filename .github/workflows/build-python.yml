name: Build Python

on:
  workflow_call:
    inputs:
      version:
        description: 'Version of the Python package to build'
        required: true
        type: string

jobs:
  build-angular:
    uses: ./.github/workflows/build-angular.yml

  build-python:
    runs-on: ubuntu-latest
    needs: build-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r ./requirements.build.txt
        working-directory: ./python

      - name: Clear previous build artifacts
        run: rm -rf ./dist ./multimodalsim_viewer.egg-info
        working-directory: ./python

      - name: Clear previous Angular build artifacts
        run: rm -rf ./python/multimodalsim_viewer/ui/static

      - name: Download Angular build artifacts
        uses: actions/download-artifact@v4
        with:
          name: angular-build-artifacts
          path: ./python/multimodalsim_viewer/ui/static

      - name: Build Python package
        run: PYTHON_PACKAGE_VERSION=${{ inputs.version }} python -m build
        working-directory: ./python

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-build-artifacts
          path: ./python/dist
